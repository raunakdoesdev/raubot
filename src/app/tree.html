<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#141414">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>raubot · memory</title>
<style>
*{box-sizing:border-box}
html{background:#141414;-webkit-text-size-adjust:100%}body{margin:0;background:#141414;font:14px/1.45 ui-sans-serif,system-ui,-apple-system;color:#e8e8e8;padding:0 max(14px,env(safe-area-inset-left)) 40px}
header{position:sticky;top:0;background:#141414;display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #2c2c2c;color:#8b8b8b;flex-wrap:wrap}
header b{color:#e8e8e8}header a{color:inherit}
h3{font-size:13px;color:#8b8b8b;font-weight:600;margin:18px 0 6px}
.n{border-left:2px solid #2c2c2c;padding:4px 0 4px 10px;margin:2px 0;cursor:pointer;overflow-wrap:anywhere}
.n:hover{border-color:#555}.n.open{border-color:#e8e8e8}
.k{font:11px ui-monospace,monospace;color:#777;margin-right:6px}
.kids{margin-left:12px}
.raw{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;background:#1b1b1b;border-radius:6px;padding:8px;margin:4px 0 4px 12px;overflow-x:auto}
.pending{color:#d9a441}
table{border-collapse:collapse;font:12px ui-monospace,monospace;width:100%}
td,th{padding:3px 6px;text-align:right;border-bottom:1px solid #242424}th{color:#8b8b8b;font-weight:500}
.wrap{overflow-x:auto}
</style>
<header><b>memory</b><span id="stats"></span><a href="/">chat</a></header>
<h3>Cache (last turns' requests)</h3><div class="wrap"><table id="usage"></table></div>
<h3>View — what the model sees each turn (tap to expand)</h3><div id="view"></div>
<script>
const $=id=>document.getElementById(id);
const get=q=>fetch("/tree.json"+(q||"")).then(r=>r.json());
function node(p){
  const d=document.createElement("div");d.className="n"+(p.text===null?" pending":"");
  d.innerHTML=`<span class="k">#${p.id}${p.n>1?"+"+p.n:""} L${p.l}</span>`;
  d.append(p.text??"(summarizing…)");
  let kids;
  d.onclick=async e=>{e.stopPropagation();
    if(kids){kids.remove();kids=null;d.classList.remove("open");return}
    const r=await get(`?l=${p.l}&i=${p.i}`);kids=document.createElement("div");
    if(r.raw!==undefined){kids.className="raw";kids.textContent=`[${r.kind} · ${r.date}]\n${r.raw}`}
    else{kids.className="kids";for(const c of r.children)kids.append(node(c))}
    d.after(kids);d.classList.add("open")};
  return d}
get().then(r=>{
  $("stats").textContent=`${r.log} messages · ${r.view.length} lines · ${(r.bytes/1000).toFixed(1)} KB · ${r.pending?"summarizing":"settled"}`;
  for(const p of r.view)$("view").append(node(p));
  const u=r.usage.slice().reverse();
  $("usage").innerHTML="<tr><th>time</th><th>input</th><th>cache read</th><th>cache write</th><th>output</th><th>hit</th></tr>"+u.map(x=>{const tot=x.input+x.cacheRead+x.cacheWrite;return`<tr><td>${new Date(x.date).toLocaleTimeString()}</td><td>${x.input}</td><td>${x.cacheRead}</td><td>${x.cacheWrite}</td><td>${x.output}</td><td>${tot?Math.round(100*x.cacheRead/tot):0}%</td></tr>`}).join("");
});
</script>
