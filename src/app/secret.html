<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#141414">
<meta name="robots" content="noindex">
<title>raubot needs {{name}}</title>
<meta property="og:title" content="raubot needs {{name}}"><meta property="og:description" content="{{why}}">
<meta property="og:image" content="{{origin}}/s/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
html{background:#141414}body{margin:0;font:16px/1.5 -apple-system,system-ui,sans-serif;color:#e8e8e8;display:grid;place-items:center;min-height:100dvh;padding:20px;box-sizing:border-box}
.card{width:100%;max-width:420px;background:#1f1f1f;border:1px solid #2c2c2c;border-radius:20px;padding:22px}
h1{font-size:17px;margin:0 0 4px}code{font:15px ui-monospace,Menlo,monospace;background:#262626;border-radius:6px;padding:1px 6px}
p{color:#9a9a9a;margin:0 0 18px;font-size:15px}
input,select,button{font:inherit;color:inherit;border-radius:12px;border:1px solid #3a3a3a;background:#161616;padding:11px 13px;width:100%;box-sizing:border-box}
input{font-family:ui-monospace,Menlo,monospace;font-size:15px;margin-bottom:10px}.row{display:flex;gap:10px}select{flex:1}
button{background:#e8e8e8;color:#111;border:0;font-weight:600;flex:1;cursor:pointer}button:disabled{opacity:.5}
.note{font-size:13px;color:#777;margin:14px 0 0}.done h1{color:#7bd88f}
</style></head><body>
<form class="card" id="f"><h1>raubot needs <code>{{name}}</code></h1><p>{{why}}</p>{{body}}</form>
<script>
const f = document.getElementById("f");
f.onsubmit = async (e) => {
  e.preventDefault();
  const b = f.querySelector("button"); b.disabled = true; b.textContent = "Saving…";
  const r = await fetch(location.pathname, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ value: f.value.value, ttl: Number(f.ttl.value) || undefined }) });
  if (r.ok) f.innerHTML = `<div class="done"><h1>Saved</h1><p>raubot can use it now. You can close this page.</p></div>`;
  else { b.disabled = false; b.textContent = "Save"; alert(await r.text()); }
};
</script></body></html>
