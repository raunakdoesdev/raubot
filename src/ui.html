<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#fff">
<title>raubot</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.5 ui-sans-serif,system-ui,-apple-system;color:#111;display:flex;flex-direction:column;height:100dvh}
header{display:flex;gap:12px;align-items:center;padding:10px max(16px,env(safe-area-inset-left));border-bottom:1px solid #eee;font-size:14px;color:#888}
header b{color:#111}#status{flex:1;text-align:right}
header a{color:inherit;padding:6px 0}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px max(16px,env(safe-area-inset-left))}
#log,#partial{max-width:760px;margin:0 auto}
#log>div,#partial{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}
.user{background:#f1f1f1;padding:8px 12px;border-radius:12px;margin-left:15%!important}
.tool,.echo{color:#999;font:12px/1.4 ui-monospace,monospace;max-height:4.2em;overflow:hidden}
#partial{color:#555}
form{display:flex;gap:8px;align-items:flex-end;max-width:792px;width:100%;margin:0 auto;padding:8px max(16px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom))}
textarea{flex:1;font:16px/1.4 inherit;padding:10px 12px;border:1px solid #ddd;border-radius:18px;resize:none;max-height:40dvh;outline:none}
button{font:inherit;min-width:44px;height:44px;border:0;border-radius:22px;background:#111;color:#fff;padding:0 14px}
#stop{background:#eee;color:#111;display:none}
</style>
<header><b>raubot</b><span id="status"></span><a href="/tree">tree</a></header>
<main id="main"><div id="log"></div><div id="partial"></div></main>
<form id="f"><textarea id="t" rows="1" placeholder="Message" enterkeyhint="send"></textarea><button type="button" id="stop">stop</button><button id="send">↑</button></form>
<script>
const $=id=>document.getElementById(id), main=$("main"), t=$("t");
const near=()=>main.scrollHeight-main.scrollTop-main.clientHeight<120;
const down=(force)=>{if(force||near())main.scrollTop=1e9};
let ws;
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onmessage=e=>{const m=JSON.parse(e.data),stick=near();
    if(m.history){for(const x of m.history){const d=document.createElement("div");d.className=x.kind;d.title="#"+x.i;d.textContent=x.kind==="talk"||x.kind==="user"?x.text:x.kind+" "+x.text;$("log").append(d)}$("partial").textContent=""}
    if(m.partial!==undefined)$("partial").textContent=m.partial;
    if(m.busy!==undefined){$("status").textContent=(m.busy?"thinking ":"")+(m.pending?"summarizing":"");$("stop").style.display=m.busy?"block":"none"}
    if(m.status)$("status").textContent=m.status;
    if(m.error)$("status").textContent=m.error;
    if(stick)down(true)};
  ws.onclose=()=>setTimeout(()=>{$("log").innerHTML="";connect()},1000);
}
connect();
const fit=()=>{t.style.height="auto";t.style.height=t.scrollHeight+2+"px"};
const send=()=>{const v=t.value.trim();if(!v)return;ws.send(JSON.stringify({send:v}));t.value="";fit();down(true)};
t.oninput=fit;
t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();send()}};
$("f").onsubmit=e=>{e.preventDefault();send();t.focus()};
$("stop").onclick=()=>ws.send(JSON.stringify({stop:true}));
</script>
