<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#141414">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>raubot</title>
<link rel="stylesheet" href="https://esm.sh/highlight.js@11.11.1/styles/github-dark.min.css">
<style>
:root{--bg:#141414;--fg:#e8e8e8;--mute:#8b8b8b;--line:#2c2c2c;--card:#1f1f1f;--chip:#262626;--l:max(18px,env(safe-area-inset-left));--r:max(18px,env(safe-area-inset-right))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) var(--r) 10px var(--l);font-size:15px}
header b{font-weight:600}
#status{flex:1;text-align:right;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a{color:var(--mute);text-decoration:none;font-size:20px;line-height:1;padding:6px 2px}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding:4px var(--r) 16px var(--l)}
#log,#partial{max-width:720px;margin:0 auto;min-width:0}
.msg{margin:14px 0;overflow-wrap:anywhere;min-width:0}
.user{margin-left:auto;width:fit-content;max-width:85%;background:var(--chip);padding:10px 15px;border-radius:20px;white-space:pre-wrap}
.talk>:first-child,#partial>:first-child{margin-top:0}.talk>:last-child,#partial>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md table{margin:0 0 12px}
.md ul,.md ol{padding-left:22px}.md li{margin:4px 0}.md li::marker{color:var(--mute)}
.md h1,.md h2,.md h3,.md h4{font-size:16px;font-weight:600;margin:18px 0 8px}
.md a{color:#8ab4ff}.md strong{font-weight:600}.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md code{font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);border-radius:5px;padding:1px 5px}
.md pre{background:#1b1b1b;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.md pre code{background:none!important;padding:0!important;white-space:pre}
.md blockquote{border-left:3px solid var(--line);padding-left:12px;color:#bdbdbd}
.md table{display:block;overflow-x:auto;border-collapse:collapse;font-size:14px}.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
details.tool{color:var(--mute);font-size:13px;margin:8px 0}
details.tool summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
details.tool summary::-webkit-details-marker{display:none}
details.tool summary::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#555}
details.tool pre{font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#1b1b1b;border-radius:8px;padding:10px;margin:6px 0 0;max-height:50vh;overflow:auto}
#partial{color:#cfcfcf}
form{width:100%;max-width:756px;margin:0 auto;padding:6px var(--r) max(10px,env(safe-area-inset-bottom)) var(--l)}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 12px 10px 16px;display:flex;flex-direction:column;gap:6px}
textarea{width:100%;font:16px/1.45 inherit;font-family:inherit;font-size:16px;color:var(--fg);background:transparent;border:0;outline:0;resize:none;max-height:38dvh;padding:2px 0}
textarea::placeholder{color:#6f6f6f}
.bar{display:flex;justify-content:flex-end;gap:8px}
button{flex:none;width:36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}
#send{background:var(--fg);color:#111}#send:disabled{background:#3a3a3a;color:#777}
#stop{background:#3a3a3a;color:var(--fg);display:none}
button svg{width:18px;height:18px}
</style>
<header><b>raubot</b><span id="status"></span><a href="/settings" aria-label="settings">⚙︎</a></header>
<main id="main"><div id="log"></div><div id="partial" class="md"></div></main>
<form id="f"><div class="box">
<textarea id="t" rows="1" placeholder="Message raubot" enterkeyhint="send" autocomplete="off"></textarea>
<div class="bar"><button type="button" id="stop" aria-label="stop"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg></button><button id="send" aria-label="send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
</div></form>
<script type="module">
import { marked } from "https://esm.sh/marked@15.0.12";
import hljs from "https://esm.sh/highlight.js@11.11.1/lib/common";
marked.setOptions({ gfm: true, breaks: true });
marked.use({ renderer: { code({ text, lang }) { const l = hljs.getLanguage(lang) ? lang : undefined; const h = l ? hljs.highlight(text, { language: l }) : hljs.highlightAuto(text); return `<pre><code class="hljs">${h.value}</code></pre>`; } } });
const $ = (id) => document.getElementById(id), main = $("main"), t = $("t"), log = $("log"), partial = $("partial");
const md = (s) => marked.parse(s ?? "");
const near = () => main.scrollHeight - main.scrollTop - main.clientHeight < 120;
const down = (force) => { if (force || near()) main.scrollTop = 1e9; };
let open = [];
function add(x) {
  if (x.kind === "tool" || x.kind === "echo") {
    const name = x.text.split(/[\s:]/)[0];
    const j = x.kind === "echo" ? open.findIndex((o) => o.name === name) : -1;
    if (j >= 0) { const lastTool = open.splice(j, 1)[0];
      lastTool.s.textContent = `${name} → ${x.text.slice(name.length + 1).trim().split("\n")[0]}`;
      lastTool.p.textContent += "\n\n" + x.text; return;
    }
    const d = document.createElement("details"); d.className = "tool msg";
    const s = document.createElement("summary"), p = document.createElement("pre");
    s.textContent = x.kind === "tool" ? name : `${name} → ${x.text.slice(name.length + 1).trim().split("\n")[0]}`;
    p.textContent = x.text; d.append(s, p); log.append(d);
    if (x.kind === "tool") open.push({ name, s, p }); return;
  }
  open = [];
  const d = document.createElement("div"); d.title = "#" + x.i;
  if (x.kind === "user") { d.className = "msg user"; d.textContent = x.text; }
  else { d.className = "msg talk md"; d.innerHTML = md(x.text); }
  log.append(d);
}
let raf = 0, pending = "";
const showPartial = (s) => { pending = s; if (!raf) raf = requestAnimationFrame(() => { raf = 0; partial.innerHTML = pending ? md(pending) : ""; }); };
let ws;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data), stick = near();
    if (m.history) { for (const x of m.history) add(x); showPartial(""); }
    if (m.partial !== undefined) showPartial(m.partial);
    if (m.busy !== undefined) { $("status").textContent = (m.busy ? "thinking… " : "") + (m.pending ? "summarizing" : ""); $("stop").style.display = m.busy ? "grid" : "none"; }
    if (m.status) $("status").textContent = m.status;
    if (m.error) $("status").textContent = m.error;
    if (stick) requestAnimationFrame(() => down(true));
  };
  ws.onclose = () => setTimeout(() => { log.innerHTML = ""; connect(); }, 1000);
}
connect();
const fit = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; $("send").disabled = !t.value.trim(); };
const send = () => { const v = t.value.trim(); if (!v) return; ws.send(JSON.stringify({ send: v })); t.value = ""; fit(); down(true); };
t.oninput = fit;
t.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); send(); } };
$("f").onsubmit = (e) => { e.preventDefault(); send(); };
$("stop").onclick = () => ws.send(JSON.stringify({ stop: true }));
</script>
