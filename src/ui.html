<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>raubot</title>
<style>
body{font:15px/1.5 ui-sans-serif,system-ui;max-width:760px;margin:0 auto;padding:0 16px;color:#111}
header{display:flex;justify-content:space-between;padding:12px 0;color:#888;font-size:13px}
#log>div{white-space:pre-wrap;margin:10px 0}
.user{background:#f3f3f3;padding:8px 12px;border-radius:8px}
.tool,.echo{color:#888;font:12px ui-monospace,monospace;max-height:6em;overflow:hidden}
form{position:sticky;bottom:0;background:#fff;padding:12px 0;display:flex;gap:8px}
textarea{flex:1;font:inherit;padding:8px;resize:none}
</style>
<header><b>raubot</b><span id="status"></span><a href="/tree">tree</a></header>
<div id="log"></div><div id="partial" style="white-space:pre-wrap;color:#555"></div>
<form id="f"><textarea id="t" rows="2" placeholder="message (enter to send)"></textarea><button type="button" id="stop">stop</button></form>
<script>
const $=id=>document.getElementById(id);
let ws;
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.history){for(const x of m.history){const d=document.createElement("div");d.className=x.kind;d.title="#"+x.i;d.textContent=x.kind==="talk"||x.kind==="user"?x.text:x.kind+" "+x.text;$("log").append(d)}$("partial").textContent="";scrollTo(0,1e9)}
    if(m.partial!==undefined){$("partial").textContent=m.partial;scrollTo(0,1e9)}
    if(m.busy!==undefined)$("status").textContent=(m.busy?"thinking ":"")+(m.pending?"summarizing":"");
    if(m.status)$("status").textContent=m.status;
    if(m.error)alert(m.error)};
  ws.onclose=()=>setTimeout(()=>{$("log").innerHTML="";connect()},1000);
}
connect();
$("t").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const v=$("t").value.trim();if(v){ws.send(JSON.stringify({send:v}));$("t").value=""}}};
$("stop").onclick=()=>ws.send(JSON.stringify({stop:true}));
</script>
